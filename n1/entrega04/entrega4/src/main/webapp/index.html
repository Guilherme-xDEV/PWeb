<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Usuários</title>
</head>
<body>

<h1>Cadastro de Usuários</h1>

<form action="usuarios" method="post">

    <label for="nome">Nome:</label>
    <input
            type="text"
            id="nome"
            name="nome"
            required>

    <br><br>

    <label for="email">Email:</label>
    <input
            type="email"
            id="email"
            name="email"
            required>

    <br><br>

    <button type="submit">
        Cadastrar
    </button>

</form>

</body>
</html>
